# ClusterSecretStore: Parameter Storeへの接続設定（EC2 IAMロールで認証）
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: default
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-cost-secret
  namespace: aws-cost
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: aws-cost-secret
  data:
    - secretKey: aws-access-key-id
      remoteRef:
        key: /k3s/aws-cost/aws-access-key-id
    - secretKey: aws-secret-access-key
      remoteRef:
        key: /k3s/aws-cost/aws-secret-access-key
    - secretKey: aws-region
      remoteRef:
        key: /k3s/aws-cost/aws-region
    - secretKey: mysql-dsn
      remoteRef:
        key: /k3s/aws-cost/mysql-dsn
    - secretKey: slack-webhook-url
      remoteRef:
        key: /k3s/aws-cost/slack-webhook-url
---
